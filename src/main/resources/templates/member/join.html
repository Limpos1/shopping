<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>회원가입</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
<header class="topbar">
    <div th:replace="~{fragments/header :: header}"></div>
    <div class="menu">
        <span>
            <a href="/login">로그인</a>
            <a href="/join">회원가입</a>
        </span>
    </div>
</header>

<div class="container">
    <h1>회원가입</h1>

    <div class="card">
        <!-- th:object로 폼 객체를 지정하면 *{필드명}으로 접근할 수 있다. -->
        <form action="/join" method="post" th:object="${joinForm}">
            <div class="form-group">
                <label for="username">아이디</label>
                <input type="text" class="field-error" th:field="*{username}" placeholder="3~20자">
                <!-- 해당 필드에 검증 오류가 있으면 에러 메시지를 출력한다. -->
                <div class="error" th:errors="*{username}"></div>
            </div>

            <div class="form-group">
                <label for="password">비밀번호</label>
                <input type="password" th:field="*{password}" placeholder="4~20자">
                <div class="error" th:errors="*{password}"></div>
            </div>

            <div class="form-group">
                <label for="name">이름</label>
                <input type="text" th:field="*{name}">
                <div class="error" th:errors="*{name}"></div>
            </div>

            <div class="button-row">
                <button type="submit" class="btn">가입하기</button>
                <a href="/products" class="btn gray">취소</a>
            </div>
        </form>
    </div>
</div>
</body>
</html>
