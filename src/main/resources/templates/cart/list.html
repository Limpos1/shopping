<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>장바구니</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>

<div th:replace="~{fragments/header :: header}"></div>

<div class="container">
  <h1>장바구니</h1>

  <div th:if="${#lists.isEmpty(cartItems)}" class="empty">
    장바구니가 비어 있습니다.
  </div>

  <table class="data-list" th:unless="${#lists.isEmpty(cartItems)}">
    <thead>
    <tr>
      <th>상품명</th>
      <th class="right">단가</th>
      <th class="center">수량</th>
      <th class="right">소계</th>
      <th class="center">삭제</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="item : ${cartItems}">
      <td><a th:href="@{/products/{id}(id=${item.product.id})}" th:text="${item.product.name}"></a></td>
      <td class="right" th:text="${item.product.price} + '원'"></td>
      <td class="center">
        <form th:action="@{/cart/{id}/update(id=${item.id})}" method="post"
              style="display:flex; gap:6px; justify-content:center;">
          <input type="number" name="quantity" th:value="${item.quantity}" min="1" class="qty-input">
          <button type="submit" class="btn gray small">변경</button>
        </form>
      </td>
      <td class="right" th:text="${item.getTotalPrice()} + '원'"></td>
      <td class="center">
        <form th:action="@{/cart/{id}/delete(id=${item.id})}" method="post">
          <button type="submit" class="btn danger small">삭제</button>
        </form>
      </td>
    </tr>
    </tbody>
  </table>

  <div class="total-row" th:unless="${#lists.isEmpty(cartItems)}">
    <span>총 합계</span>
    <span class="amount" th:text="${totalPrice} + '원'"></span>
  </div>
</div>
</body>
</html>
