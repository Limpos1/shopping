<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title th:text="${product.name}">상품 상세</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>

<div th:replace="~{fragments/header :: header}"></div>

<div class="container">
    <div class="card">
        <div class="thumb" style="height:240px;">
            <span>이미지 없음</span>
        </div>

        <h1 th:text="${product.name}"></h1>

        <div class="price-big" th:text="${product.price} + '원'"></div>

        <div class="meta">
            <span th:if="${product.isSoldOut()}" class="badge soldout">품절</span>
            <span th:unless="${product.isSoldOut()}" th:text="'재고 ' + ${product.stock} + '개'"></span>
        </div>

        <p class="desc" th:text="${product.description}"></p>

        <div class="button-row">
            <a href="/products" class="btn gray">목록으로</a>
        </div>
    </div>
</div>
</body>
</html>
