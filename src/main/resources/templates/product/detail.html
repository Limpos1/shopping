<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title th:text="${product.name}">상품 상세</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>

<div th:replace="~{fragments/header :: header}"></div>

<div class="container">
    <div class="card">
        <div class="thumb" style="height:240px;">
            <span>이미지 없음</span>
        </div>

        <h1 th:text="${product.name}"></h1>

        <div class="price-big" th:text="${product.price} + '원'"></div>

        <div class="meta">
            <span th:if="${product.isSoldOut()}" class="badge soldout">품절</span>
            <span th:unless="${product.isSoldOut()}" th:text="'재고 ' + ${product.stock} + '개'"></span>
        </div>

        <p class="desc" th:text="${product.description}"></p>

        <form sec:authorize="isAuthenticated()" th:if="${!product.isSoldOut()}" action="/cart/add" method="post" class="button-row">
            <input type="hidden" name="productId" th:value="${product.id}">
            <input type="number" name="quantity" value="1" min="1" th:max="${product.stock}" class="qty-input">
            <button type="submit" class="btn">장바구니 담기</button>
            <a href="/products" class="btn gray">목록으로</a>
        </form>
        <div sec:authorize="isAuthenticated()" th:if="${product.isSoldOut()}" class="button-row">
            <button type="button" class="btn" disabled>품절된 상품</button>
            <a href="/products" class="btn gray">목록으로</a>
        </div>
        <div sec:authorize="isAnonymous()" class="button-row">
            <a href="/login" class="btn">로그인하고 담기</a>
            <a href="/products" class="btn gray">목록으로</a>
        </div>
    </div>
</div>
</body>
</html>
