<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>주문서</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div th:replace="~{fragments/header :: header}"></div>

<div class="container">
    <h1>주문서</h1>

    <div th:if="${errorMessage}" class="alert" th:text="${errorMessage}"></div>

    <div class="card">
        <h2>주문 상품</h2>
        <table class="data-list">
            <thead>
            <tr>
                <th>상품</th>
                <th class="center">수량</th>
                <th class="right">합계</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="item : ${cartItems}">
                <td th:text="${item.product.name}"></td>
                <td class="center" th:text="${item.quantity}"></td>
                <td class="right" th:text="${item.getTotalPrice()} + '원'"></td>
            </tr>
            </tbody>
        </table>
        <div class="total-row">
            <span>총 결제 금액</span>
            <span class="amount" th:text="${totalPrice} + '원'"></span>
        </div>
    </div>

    <div class="card">
        <h2>배송 정보</h2>
        <form th:action="@{/orders}" method="post" th:object="${orderForm}">
            <div class="form-group">
                <label for="receiverName">받는 분</label>
                <input type="text" id="receiverName" th:field="*{receiverName}">
                <div class="error" th:errors="*{receiverName}"></div>
            </div>

            <div class="form-group">
                <label for="address">주소</label>
                <input type="text" id="address" th:field="*{address}">
                <div class="error" th:errors="*{address}"></div>
            </div>

            <div class="form-group">
                <label for="phone">연락처</label>
                <input type="text" id="phone" th:field="*{phone}" placeholder="010-0000-0000">
                <div class="error" th:errors="*{phone}"></div>
            </div>

            <div class="button-row">
                <button type="submit" class="btn">주문하기</button>
                <a href="/cart" class="btn gray">장바구니로</a>
            </div>
        </form>
    </div>
</div>
</body>
</html>
