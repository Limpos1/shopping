<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>주문서</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
<div th:replace="~{fragments/header :: header}"></div>

<div class="container">
    <h1>주문서</h1>

    <div class="card">
        <h2>주문 상품</h2>
        <table class="data-list">
            <thead>
                <tr>
                    <th>상품</th>
                    <th class="center">수량</th>
                    <th class="right">합계</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>기계식 키보드</td>
                    <td class="center">1</td>
                    <td class="right">89,000원</td>
                </tr>
                <tr>
                    <td>무선 마우스</td>
                    <td class="center">2</td>
                    <td class="right">64,000원</td>
                </tr>
            </tbody>
        </table>
        <div class="total-row">
            <span>총 결제 금액</span>
            <span class="amount">153,000원</span>
        </div>
    </div>

    <div class="card">
        <h2>배송 정보</h2>
        <form method="post">
            <div class="form-group">
                <label for="receiverName">받는 분</label>
                <input type="text" id="receiverName" name="receiverName" value="홍길동">
                <div class="error"></div>
            </div>

            <div class="form-group">
                <label for="address">주소</label>
                <input type="text" id="address" name="address" class="field-error">
                <div class="error">주소를 입력해 주세요.</div>
            </div>

            <div class="form-group">
                <label for="phone">연락처</label>
                <input type="text" id="phone" name="phone" placeholder="010-0000-0000">
                <div class="error"></div>
            </div>

            <div class="button-row">
                <button type="submit" class="btn">주문하기</button>
                <a href="../cart/list.html" class="btn gray">장바구니로</a>
            </div>
        </form>
    </div>
</div>
</body>
</html>
