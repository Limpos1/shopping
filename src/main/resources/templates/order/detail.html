<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>주문 상세</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div th:replace="~{fragments/header :: header}"></div>

<div class="container">
    <h1>주문 상세</h1>

    <div class="card">
        <div class="meta">
            주문번호 <span th:text="${order.id}"></span> ·
            <span th:text="${#temporals.format(order.orderedAt, 'yyyy-MM-dd HH:mm')}"></span> ·
            <span th:if="${order.status.name() == 'ORDERED'}" class="badge ordered">주문완료</span>
            <span th:if="${order.status.name() == 'CANCELED'}" class="badge canceled">취소됨</span>
        </div>

        <table class="data-list">
            <thead>
            <tr>
                <th>상품</th>
                <th class="right">주문 당시 가격</th>
                <th class="center">수량</th>
                <th class="right">합계</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="item : ${order.orderItems}">
                <td>
                    <a th:href="@{/products/{id}(id=${item.product.id})}" th:text="${item.product.name}"></a>
                </td>
                <td class="right" th:text="${item.orderPrice} + '원'"></td>
                <td class="center" th:text="${item.count}"></td>
                <td class="right" th:text="${item.getTotalPrice()} + '원'"></td>
            </tr>
            </tbody>
        </table>

        <div class="total-row">
            <span>총 결제 금액</span>
            <span class="amount" th:text="${order.getTotalPrice()} + '원'"></span>
        </div>
    </div>

    <div class="card">
        <h2>배송 정보</h2>
        <p class="meta">
            받는 분: <span th:text="${order.receiverName}"></span><br>
            주소: <span th:text="${order.address}"></span><br>
            연락처: <span th:text="${order.phone}"></span>
        </p>
    </div>

    <div class="button-row">
        <form th:if="${order.status.name() == 'ORDERED'}" th:action="@{/orders/{id}/cancel(id=${order.id})}" method="post">
            <button type="submit" class="btn danger">주문 취소</button>
        </form>
        <a href="/orders" class="btn gray">주문 내역</a>
    </div>
</div>
</body>
</html>
