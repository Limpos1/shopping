<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>주문 내역</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div th:replace="~{fragments/header :: header}"></div>

<div class="container">
    <h1>주문 내역</h1>

    <div th:if="${#lists.isEmpty(orders)}" class="empty">
        주문 내역이 없습니다.
    </div>

    <table class="data-list" th:unless="${#lists.isEmpty(orders)}">
        <thead>
        <tr>
            <th>주문번호</th>
            <th>주문일시</th>
            <th>주문 상품</th>
            <th class="right">금액</th>
            <th class="center">상태</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="order : ${orders}">
            <td>
                <a th:href="@{/orders/{id}(id=${order.id})}" th:text="${order.id}"></a>
            </td>
            <td th:text="${#temporals.format(order.orderedAt, 'yyyy-MM-dd HH:mm')}"></td>
            <td>
                <span th:text="${order.orderItems[0].product.name}"></span>
                <span th:if="${order.orderItems.size()} > 1" th:text="' 외 ' + (${order.orderItems.size()} - 1) + '건'"></span>
            </td>
            <td class="right" th:text="${order.getTotalPrice()} + '원'"></td>
            <td class="center">
                <span th:if="${order.status.name() == 'ORDERED'}" class="badge ordered">주문완료</span>
                <span th:if="${order.status.name() == 'CANCELED'}" class="badge canceled">취소됨</span>
            </td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
